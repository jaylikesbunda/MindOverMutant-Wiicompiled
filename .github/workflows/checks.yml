name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify builder identity
        run: python tools/builder_revision.py
      - name: Check publication inputs
        run: python tools/check_release.py
      - name: Check Python syntax
        run: python -m compileall -q tools launcher/scripts
      - name: Validate RecompLauncher manifest
        run: |
          python -m pip install jsonschema==4.26.0
          python launcher/scripts/check_recomplauncher.py
      - name: Test builder execution
        run: python -m unittest discover -s tools/tests -p test_builder_execution.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Launcher tests
        working-directory: launcher/src-tauri
        run: cargo test --locked --lib -- --skip packaged_builder_matches_declared_inputs
